<!-- @dsCard group="Feedback" height=1080 subtitle="Estado vazio com ícone em tile de 56px, título, próximo passo e ação; variação em linha; esqueleto na forma do conteúdo" -->
<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block">
<link rel="stylesheet" href="../../kit/lume.css">
<style>
  body { padding: var(--space-24); min-height: 100vh; }
  .wrap { max-width: 1100px; margin-inline: auto; display: grid; gap: var(--space-32); }
  .lead { color: var(--text-secondary); max-width: 64ch; }
  .stack { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-24); align-items: start; }
  figure { margin: 0; display: flex; flex-direction: column; gap: var(--space-12); }
  figcaption { color: var(--text-muted); }
  .panel { padding: var(--space-20); }
  .panel.wide { grid-column: 1 / -1; padding: var(--space-24); }
  .panel h3 { margin-bottom: var(--space-12); }

  /* tile grande (sugestão para o kit: .ico-tile.lg) */
  .ico-tile.lg { width: 56px; height: 56px; border-radius: var(--radius-lg); }
  .ico-tile.lg .ms { font-size: 28px; width: 28px; height: 28px; }

  /* EmptyState */
  .es { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-12); padding: var(--space-24) var(--space-16); }
  .es h4 { margin-top: var(--space-4); }
  .es p { max-width: 40ch; color: var(--text-secondary); }
  .es .btn { margin-top: var(--space-4); }
  .es.inline { flex-direction: row; align-items: center; text-align: left; gap: var(--space-16); padding: var(--space-8) 0; }
  .es.inline .txt { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; flex: 1; }
  .es.inline h4 { margin: 0; }
  .es.inline p { max-width: none; }
  .es.inline .btn { margin: 0; }
  .soon { display: inline-flex; align-items: center; min-height: 24px; padding: 0 var(--space-8); border-radius: var(--radius-xs); background: var(--chip); color: var(--text-secondary); box-shadow: inset 0 1px 0 var(--hairline); vertical-align: middle; margin-left: var(--space-4); }

  /* esqueleto na forma do TaskRow: hora, título + mini-segmentos, duração */
  .skrow { display: grid; grid-template-columns: 48px 1fr 56px; gap: var(--space-12); align-items: center; min-height: 56px; padding: 0 var(--space-12); }
  .skcol { display: grid; gap: var(--space-8); }
  .skel.xs { border-radius: var(--radius-xs); }
  .skel.pill { border-radius: var(--radius-full); }
  .still .skel { animation: none; }
  .es .ico-tile.lg { box-shadow: inset 0 1px 0 var(--hairline-strong), inset 0 -1px 0 color-mix(in srgb, black 20%, transparent), var(--elev-1); }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h2 class="title">Estado vazio</h2>
    <p class="body lead">Diz o que vai aparecer e como começar. Ícone em tile grande com gradiente, título em caixa de frase, uma frase de próximo passo e, no máximo, uma ação. O esqueleto tem a forma do conteúdo final.</p>
  </div>

  <div class="stack">
    <figure>
      <section class="card panel" aria-labelledby="e1">
        <h3 class="title" id="e1">Hoje</h3>
        <div class="es">
          <span class="ico-tile lg violet" aria-hidden="true"><span class="ms">event_available</span></span>
          <h4 class="title-sm">Sem rotina hoje</h4>
          <p class="body-sm">Monte sua grade em Tempo e objetivos para acompanhar o dia aqui.</p>
          <button class="btn primary" type="button"><span class="ms s20">add</span>Montar minha rotina</button>
        </div>
      </section>
      <figcaption class="caption">Com ação principal, centralizado (celular)</figcaption>
    </figure>

    <figure>
      <section class="card panel" aria-labelledby="e2">
        <h3 class="title" id="e2">Objetivos</h3>
        <div class="es">
          <span class="ico-tile lg orange" aria-hidden="true"><span class="ms">flag</span></span>
          <h4 class="title-sm">Nenhum objetivo ativo</h4>
          <p class="body-sm">Crie um objetivo para ver as etapas e o progresso aqui.</p>
          <button class="btn secondary" type="button">Criar objetivo</button>
        </div>
      </section>
      <figcaption class="caption">Com ação secundária</figcaption>
    </figure>

    <figure>
      <section class="card panel" aria-labelledby="e3">
        <h3 class="title" id="e3">Frentes da vida</h3>
        <div class="es">
          <span class="ico-tile lg cyan" aria-hidden="true"><span class="ms">favorite</span></span>
          <h4 class="title-sm">Saúde <span class="soon caption">Em breve · E2</span></h4>
          <p class="body-sm">Este módulo está a caminho. Quando chegar, ele aparece aqui, sem você precisar fazer nada.</p>
        </div>
      </section>
      <figcaption class="caption">Módulo ainda não disponível, sem ação</figcaption>
    </figure>

    <figure class="panel-wide" style="grid-column:1/-1">
      <section class="card panel wide" aria-labelledby="e4">
        <h3 class="title" id="e4">Próximas atividades</h3>
        <div class="es inline">
          <span class="ico-tile lg" aria-hidden="true"><span class="ms">bedtime</span></span>
          <div class="txt">
            <h4 class="title-sm">Nada mais agendado para hoje</h4>
            <p class="body-sm">Descanse. Para o que vem amanhã, abra Tempo e objetivos.</p>
          </div>
          <button class="btn ghost" type="button">Ver amanhã</button>
        </div>
      </section>
      <figcaption class="caption">Variação em linha (desktop, dentro de cards largos): tile neutro ao lado, texto à esquerda, ação fantasma</figcaption>
    </figure>

    <figure>
      <section class="card panel" aria-labelledby="e5" aria-busy="true">
        <h3 class="title" id="e5">Hoje</h3>
        <div class="skcol" role="status" aria-label="Carregando atividades">
          <div class="skrow"><span class="skel xs" style="height:16px;width:40px"></span><span class="skcol"><span class="skel xs" style="height:16px;width:70%"></span><span class="skel pill" style="height:4px;width:56px"></span></span><span class="skel xs" style="height:16px"></span></div>
          <div class="skrow"><span class="skel xs" style="height:16px;width:40px"></span><span class="skcol"><span class="skel xs" style="height:16px;width:55%"></span><span class="skel pill" style="height:4px;width:56px"></span></span><span class="skel xs" style="height:16px"></span></div>
          <div class="skrow"><span class="skel xs" style="height:16px;width:40px"></span><span class="skcol"><span class="skel xs" style="height:16px;width:80%"></span><span class="skel pill" style="height:4px;width:56px"></span></span><span class="skel xs" style="height:16px"></span></div>
        </div>
      </section>
      <figcaption class="caption">Esqueleto na forma do TaskRow (hora, título, mini-segmentos, duração), brilho de 1,6s</figcaption>
    </figure>

    <figure>
      <section class="card panel" aria-labelledby="e6" aria-busy="true">
        <h3 class="title" id="e6">Objetivos</h3>
        <div style="display:flex;gap:var(--space-12);overflow:hidden" role="status" aria-label="Carregando objetivos">
          <span class="skel" style="height:140px;flex:0 0 200px;border-radius:var(--radius-lg)"></span>
          <span class="skel" style="height:140px;flex:0 0 200px;border-radius:var(--radius-lg)"></span>
        </div>
      </section>
      <figcaption class="caption">Esqueleto na forma dos GoalCards (radius-lg)</figcaption>
    </figure>

    <figure>
      <section class="card panel still" aria-labelledby="e7" aria-busy="true">
        <h3 class="title" id="e7">Com reduzir movimento</h3>
        <div class="skcol" role="status" aria-label="Carregando, versão estática">
          <div class="skrow"><span class="skel xs" style="height:16px;width:40px"></span><span class="skcol"><span class="skel xs" style="height:16px;width:65%"></span><span class="skel pill" style="height:4px;width:56px"></span></span><span class="skel xs" style="height:16px"></span></div>
          <div class="skrow"><span class="skel xs" style="height:16px;width:40px"></span><span class="skcol"><span class="skel xs" style="height:16px;width:50%"></span><span class="skel pill" style="height:4px;width:56px"></span></span><span class="skel xs" style="height:16px"></span></div>
        </div>
      </section>
      <figcaption class="caption">Esqueleto estático: o que se vê quando o sistema pede menos movimento</figcaption>
    </figure>
  </div>
</div>
</body>
</html>
