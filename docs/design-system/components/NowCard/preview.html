<!-- @dsCard group="Dashboard" height=820 subtitle="Card Agora aceso: deep navy que respira, barra com cabeça luminosa, nos 4 estados" -->
<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block">
<link rel="stylesheet" href="../../kit/lume.css">
<style>
  body{padding:var(--space-24);min-height:100vh}
  .toolbar{display:flex;flex-wrap:wrap;gap:var(--space-12);align-items:center;margin-bottom:var(--space-24)}
  .toggle{display:inline-flex;align-items:center;gap:var(--space-8);min-height:var(--hit-min);cursor:pointer}
  .toggle input{width:20px;height:20px;accent-color:var(--violet)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,330px));gap:var(--space-32) var(--space-24);align-items:start}
  figure{margin:0;display:flex;flex-direction:column;gap:var(--space-12)}
  figcaption{color:var(--text-muted)}

  /* NowCard: .navy (+ .breathe quando aceso) do kit */
  .now{display:flex;flex-direction:column;width:100%;max-width:330px;min-height:200px;padding:var(--space-24)}
  .now.is-compact{padding:var(--space-20)}
  .now.quiet{box-shadow:inset 0 1px 0 var(--hairline-strong)}
  .now .overline{color:var(--card-fg);opacity:.8}
  .now .headline{margin-top:var(--space-8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .sub{margin-top:var(--space-2);color:var(--card-fg-muted)}
  .now .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .bottom{margin-top:auto;padding-top:var(--space-16)}
  .now .meta{display:flex;justify-content:space-between;gap:var(--space-8);color:var(--card-fg)}
  .now .meta small{font-size:inherit;font-weight:500;color:var(--card-fg-muted)}
  .now .bar{margin-top:var(--space-8);background:color-mix(in srgb,var(--card-fg) 15%,transparent)}
  .now .bar>i{transition:width var(--dur-fast) linear}
  .now .next{margin-top:var(--space-12)}
  .now .body3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .no-breathe .breathe{animation:none}
  @media (prefers-reduced-motion:reduce){ .now .bar>i{transition:none} }
</style>
</head>
<body class="aurora">
<div class="toolbar">
  <button class="btn secondary sm" id="adv" type="button"><span class="ms s20" aria-hidden="true">fast_forward</span>Avançar 5 min</button>
  <button class="btn secondary sm" id="rst" type="button"><span class="ms s20" aria-hidden="true">replay</span>Voltar ao início</button>
  <label class="toggle"><input type="checkbox" id="breathe" checked> <span class="body-sm">Respiração do glow</span></label>
  <span class="caption t3">Só o card em atividade é o elemento aceso: respira em dur-breathe e a barra acende. O sistema desliga a respiração em "reduzir movimento".</span>
</div>

<div class="grid" id="grid">
  <figure>
    <article class="navy breathe now" aria-label="Agora: Estudo de inglês">
      <p class="overline">AGORA</p>
      <h3 class="headline">Estudo de inglês</h3>
      <p class="sub body-sm ell">Inglês</p>
      <div class="bottom">
        <div class="meta label"><span>08:00 – 09:00</span><span id="left">faltam 25 <small>min</small></span></div>
        <div class="bar lit" role="progressbar" aria-label="Progresso da atividade atual" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58" id="pb" style="--g:var(--card-fg)"><i id="fill" style="--p:58%"></i></div>
        <p class="sub body-sm ell next">Depois: Treino · 09:30</p>
      </div>
    </article>
    <figcaption class="caption">Em atividade: aceso (glow que respira) e barra que acende com cabeça luminosa</figcaption>
  </figure>

  <figure>
    <article class="navy now" aria-label="Agora: Tempo livre">
      <p class="overline">AGORA</p>
      <h3 class="headline">Tempo livre</h3>
      <p class="sub body-sm">Aproveite o intervalo</p>
      <div class="bottom">
        <p class="label ell">Próxima: Treino às 09:30</p>
        <p class="sub body-sm">em 12 <small>min</small></p>
      </div>
    </article>
    <figcaption class="caption">Tempo livre: glow fixo, sem respirar</figcaption>
  </figure>

  <figure>
    <article class="navy now quiet" aria-label="Hoje: Dia concluído">
      <p class="overline">HOJE</p>
      <h3 class="headline">Dia concluído</h3>
      <div class="bottom">
        <p class="sub body-sm body3">Nenhuma atividade restante. Descanse, amanhã tem mais.</p>
      </div>
    </article>
    <figcaption class="caption">Dia concluído: navy em repouso, só hairline (nada aceso)</figcaption>
  </figure>

  <figure>
    <article class="navy now quiet" aria-label="Hoje: Sem rotina hoje">
      <p class="overline">HOJE</p>
      <h3 class="headline">Sem rotina hoje</h3>
      <div class="bottom">
        <p class="sub body-sm body3">Monte sua grade em Tempo e objetivos para acompanhar o dia aqui.</p>
      </div>
    </article>
    <figcaption class="caption">Sem rotina: convite, em repouso</figcaption>
  </figure>

  <figure>
    <article class="navy breathe now is-compact" aria-label="Agora: Estudo de inglês, celular estreito">
      <p class="overline">AGORA</p>
      <h3 class="headline">Estudo de inglês avançado: leitura e conversação</h3>
      <p class="sub body-sm ell">Inglês para viagem internacional</p>
      <div class="bottom">
        <div class="meta label"><span>08:00 – 09:00</span><span>faltam 25 <small>min</small></span></div>
        <div class="bar lit" role="progressbar" aria-label="Progresso da atividade atual" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58" style="--g:var(--card-fg)"><i style="--p:58%"></i></div>
        <p class="sub body-sm ell next">Depois: Treino de força · 09:30</p>
      </div>
    </article>
    <figcaption class="caption">Celular estreito (padding space-20): títulos longos cortados em uma linha</figcaption>
  </figure>

  <figure>
    <article class="navy breathe now" style="min-height:300px" aria-label="Agora: Estudo de inglês, fonte grande">
      <p class="overline">AGORA</p>
      <h3 class="headline">Estudo de inglês</h3>
      <p class="sub body-sm ell">Inglês</p>
      <div class="bottom">
        <div class="meta label"><span>08:00 – 09:00</span><span>faltam 25 <small>min</small></span></div>
        <div class="bar lit" role="progressbar" aria-label="Progresso da atividade atual" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58" style="--g:var(--card-fg)"><i style="--p:58%"></i></div>
        <p class="sub body-sm ell next">Depois: Treino · 09:30</p>
      </div>
    </article>
    <figcaption class="caption">Fonte do sistema a 1,5×: a altura mínima cresce de 200 para 300</figcaption>
  </figure>
</div>

<script>
(function(){
  var START=35, step=5, now=START; // minutos desde 08:00
  var left=document.getElementById('left'), fill=document.getElementById('fill'), pb=document.getElementById('pb');
  function paint(){
    var p=Math.round(now/60*100);
    fill.style.setProperty('--p',p+'%'); pb.setAttribute('aria-valuenow',p);
    left.innerHTML='faltam '+(60-now)+' <small>min</small>';
  }
  document.getElementById('adv').addEventListener('click',function(){ now=Math.min(55,now+step); paint(); });
  document.getElementById('rst').addEventListener('click',function(){ now=START; paint(); });
  document.getElementById('breathe').addEventListener('change',function(e){
    document.getElementById('grid').classList.toggle('no-breathe',!e.target.checked);
  });
})();
</script>
</body>
</html>
